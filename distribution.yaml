name: noc-engineer
version: 0.3.0
hermes_requires: ">=0.22.5"   # attach_to_session, cron mirror, jobs.json merge (verified in v0.22.5 source)
description: NOC agent - anomaly scan, daily summary, Mattermost questions, Grafana alerts, customer Jira tickets
author: Eigenmodes
env_requires:
  - {name: OPENAI_API_KEY, description: "Key for the Kimi K3 endpoint in config.yaml", required: true}
  - {name: MATTERMOST_URL, description: "Mattermost server URL", required: true}
  - {name: MATTERMOST_TOKEN, description: "Bot account token", required: true}
  - {name: MATTERMOST_ALLOWED_USERS, description: "User IDs (26 chars, comma-separated) allowed to talk to the agent", required: true}
  - {name: MATTERMOST_HOME_CHANNEL, description: "Team channel ID for cron output", required: true}
  - {name: MATTERMOST_REPLY_MODE, description: "off = answer in the channel; thread = answer in a thread", required: false, default: "off"}
  - {name: PROMETHEUS_URL, description: "Prometheus / Thanos Query", required: true}
  - {name: PROMETHEUS_TOKEN, description: "Read-only token", required: false}
  - {name: ECK_URL, description: "Elasticsearch (ECK)", required: false}
  - {name: ECK_USER, description: "Read-only user", required: false}
  - {name: ECK_PASSWORD, description: "Read-only password", required: false}
  - {name: GRAFANA_URL, description: "Grafana", required: false}
  - {name: GRAFANA_TOKEN, description: "Viewer service-account token", required: false}
  - {name: JIRA_URL, description: "Jira", required: false}
  - {name: JIRA_USER, description: "Jira user (comment-only permission)", required: false}
  - {name: JIRA_TOKEN, description: "Jira API token / PAT", required: false}
  - {name: NOC_JIRA_ALLOW_COMMENT, description: "true lets the agent comment on customer tickets", required: false, default: "false"}
  - {name: HERMES_LANGFUSE_PUBLIC_KEY, description: "Langfuse project public key (pk-lf-...). Empty = tracing off", required: false}
  - {name: HERMES_LANGFUSE_SECRET_KEY, description: "Langfuse project secret key (sk-lf-...)", required: false}
  - {name: HERMES_LANGFUSE_BASE_URL, description: "Self-hosted Langfuse URL", required: false}
  - {name: LANGFUSE_PLUGIN_SOURCE, description: "Git URL#langfuse of the internal mirror of hermes-official-plugins (air-gapped)", required: false}
distribution_owned: [SOUL.md, config.yaml, skills/, scripts/, cron/, distribution.yaml]
