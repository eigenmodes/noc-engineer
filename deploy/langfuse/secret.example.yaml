# Copy to secret.yaml (git-ignored), fill every value, `kubectl apply -n langfuse -f secret.yaml`.
# Generate: hex32 = `openssl rand -hex 32`, b64 = `openssl rand -base64 32`, passwords = `openssl rand -hex 16`.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: langfuse                     # chart datastores + app secrets (keys as in the chart's minimal example)
stringData:
  salt: "<hex32>"
  encryption-key: "<hex32>"          # exactly 64 hex chars
  nextauth-secret: "<b64>"
  postgresql-password: "<pw-pg>"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "<pw-pg>"
  POSTGRES_DB: "langfuse"
  USERDB_USER: "langfuse"
  USERDB_PASSWORD: "<pw-pg>"
  clickhouse-password: "<pw-ch>"
  redis-password: "<pw-redis>"
  default: "<pw-redis>"              # Valkey ACL: key == username
  s3-user: "langfuse"
  s3-password: "<pw-s3>"
  seaweedfs_s3_config: |
    {"identities":[{"name":"langfuse","credentials":[{"accessKey":"langfuse","secretKey":"<pw-s3>"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
# Headless initialization: org, project, API keys and the first user are created on Langfuse start.
# The two keys below are the ones Hermes uses (HERMES_LANGFUSE_PUBLIC_KEY / _SECRET_KEY).
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: langfuse-init
stringData:
  LANGFUSE_INIT_ORG_ID: "noc"
  LANGFUSE_INIT_ORG_NAME: "NOC"
  LANGFUSE_INIT_PROJECT_ID: "noc-engineer"
  LANGFUSE_INIT_PROJECT_NAME: "noc-engineer"
  LANGFUSE_INIT_PROJECT_RETENTION: "30"          # days; customer data, keep it short
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-<hex16>"
  LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-<hex32>"
  LANGFUSE_INIT_USER_EMAIL: "<admin email>"
  LANGFUSE_INIT_USER_NAME: "NOC admin"
  LANGFUSE_INIT_USER_PASSWORD: "<strong password>"
