model:
  provider: custom
  default: deepseek-v4                          # TBD: exact model id served by the endpoint (GET /v1/models)
  base_url: "https://REPLACE-deepseek-endpoint/v1"  # TBD

# One shared conversation per channel (not per user), so everyone who tags the bot
# sees the same context, and delivered cron messages can attach to the channel session.
group_sessions_per_user: false

# Mirror cron deliveries to the home channel into the channel conversation. Best effort on Mattermost
# (v0.22.5): it lands only when the channel has one live session. Explaining a message never depends
# on it: customer-question reads cron/output.
cron:
  mirror_delivery: true

# Health of the agent itself -> OTLP collector -> Prometheus/Grafana (alerts in deploy/monitoring.yaml).
# Exports gateway/platform up, cron scheduler heartbeat, overdue jobs, and one span per cron run.
monitoring:
  gateway_health_export:
    enabled: true
  export:
    otlp:
      enabled: true
      endpoint: "http://REPLACE-otel-collector:4318/v1/traces"   # TBD: OTel Collector (metrics/logs paths derive from it)
      headers_env: {}                                            # header name -> ENV VAR NAME, if the collector needs auth

# Read-only in practice, not only in SOUL.md. Dangerous commands need a human in chat (manual);
# cron and one-shot runs deny them. `deny` blocks these always (fnmatch, case-insensitive, checked first).
# Keys verified in Hermes v0.22.5 (guides/HERMES-REFERENCE-v0.22.5.md, "Security"). See guides/SECURITY.md.
approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  deny:
    - 'kubectl apply*'
    - 'kubectl create*'
    - 'kubectl delete*'
    - 'kubectl edit*'
    - 'kubectl patch*'
    - 'kubectl replace*'
    - 'kubectl scale*'
    - 'kubectl rollout*'
    - 'kubectl exec*'
    - 'kubectl cordon*'
    - 'kubectl drain*'
    - 'oc apply*'
    - 'oc create*'
    - 'oc delete*'
    - 'oc edit*'
    - 'oc patch*'
    - 'oc scale*'
    - 'oc rollout*'
    - 'oc exec*'
    - 'helm install*'
    - 'helm upgrade*'
    - 'helm uninstall*'
    - 'helm rollback*'
    - 'argocd app sync*'
    - 'argocd app delete*'
    - 'psql*'
    - 'ssh *'
    - 'scp *'
    - 'git push*'
    - 'systemctl *'
    - 'reboot*'
    - 'shutdown*'
    - '*curl*-X*POST*'
    - '*curl*-X*PUT*'
    - '*curl*-X*PATCH*'
    - '*curl*-X*DELETE*'
    - '*curl*--data*'
    - '*curl* -d *'
    - 'rm -rf *'
